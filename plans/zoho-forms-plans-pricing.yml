name: Zoho Forms Plans and Pricing
description: Pricing plans for Zoho Forms online form builder, covering submission limits, storage, users, and key features per tier.
url: https://www.zoho.com/forms/pricing.html
plans:
  - name: Free
    description: Single-user free plan with limited forms and submissions, suitable for basic form creation needs.
    price: 0
    currency: USD
    unit: month
    users: 1
    features:
      - 3 forms
      - 500 submissions per month
      - 200 MB file storage
      - 10 payment submissions
      - Unlimited form views
  - name: Basic
    description: Single-user paid plan with unlimited forms and 10,000 monthly submissions.
    price: 12
    currency: USD
    unit: month
    users: 1
    features:
      - Unlimited forms
      - 10,000 submissions per month
      - 500 MB file storage
      - Unlimited payment submissions
      - Branding and custom form themes
      - Payment gateway integrations
  - name: Standard
    description: Team plan for up to 10 users with expanded submission limits and storage.
    price: 30
    currency: USD
    unit: month
    users: 10
    features:
      - Unlimited forms
      - 25,000 submissions per month
      - 2 GB file storage
      - Unlimited payment submissions
      - Branding and custom form themes
      - Workflow automation
      - Conditional logic
  - name: Professional
    description: Plan for up to 25 users with high submission volume and 5 GB storage.
    price: 60
    currency: USD
    unit: month
    users: 25
    features:
      - Unlimited forms
      - 75,000 submissions per month
      - 5 GB file storage
      - Unlimited payment submissions
      - Branding and custom form themes
      - Workflow automation
      - Conditional logic
      - Advanced integrations
  - name: Premium
    description: Enterprise-grade plan for up to 100 users with the highest submission volume, HIPAA compliance, and advanced administrative features.
    price: 110
    currency: USD
    unit: month
    users: 100
    features:
      - Unlimited forms
      - 150,000 submissions per month
      - 10 GB file storage
      - Unlimited payment submissions
      - HIPAA compliance
      - Auto-trash
      - Record audit
      - SMTP configuration
      - Report scheduler
      - Branding and custom form themes
      - Workflow automation
      - Conditional logic
      - Advanced integrations
addons:
  - name: Additional Submissions
    description: 10,000 extra submissions per month as a recurring add-on.
    type: recurring
  - name: Additional Storage
    description: 5 GB extra file storage as a recurring add-on.
    type: recurring
  - name: PDF Credits
    description: One-time purchase of credits for PDF generation features.
    type: one-time
  - name: AI Credits
    description: One-time purchase of credits for AI-powered form features.
    type: one-time
  - name: Additional Users
    description: Extra user seats available for the Premium plan.
    type: recurring
